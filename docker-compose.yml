# Local development only. Production uses docker-compose.prod.yml.
x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DEBUG: "True"
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentbook}
      POSTGRES_USER: ${POSTGRES_USER:-rentbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentbook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentbook} -d ${POSTGRES_DB:-rentbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info

volumes:
  postgres_data:
