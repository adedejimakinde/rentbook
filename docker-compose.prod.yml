# Production on the VPS: docker compose -f docker-compose.prod.yml up -d --build
# Uses config.settings.prod, gunicorn and requirements.txt only. The code is
# baked into the image (no source mount) and nothing runs the dev server.
# Run migrations after each deploy:
#   docker compose -f docker-compose.prod.yml exec web python manage.py migrate

x-app: &app
  build:
    context: .
    args:
      REQUIREMENTS: requirements.txt
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
    DEBUG: "False"
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: >-
      sh -c "python manage.py tailwind build &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 30"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: celery -A config worker --loglevel=info

  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentbook}
      POSTGRES_USER: ${POSTGRES_USER:-rentbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentbook} -d ${POSTGRES_DB:-rentbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
