{% load core_tags %}<li class="row">{% if icon_name %}<span class="tile">{% icon icon_name 20 %}</span>{% endif %}
  <span class="min-w-0 flex-1"><span class="block font-bold [overflow-wrap:anywhere]">{% if href %}<a href="{{ href }}" class="after:absolute after:inset-0">{{ title }}</a>{% else %}{{ title }}{% endif %}</span>{% if text %}<span class="block text-small muted">{{ text }}</span>{% endif %}</span>
  {% if href %}<span class="row-chevron">{% icon "chevron-right" 18 %}</span>{% endif %}
</li>
