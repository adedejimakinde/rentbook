{% comment %}Filter chip. Pass href for a link (active marks aria-current), else a toggle button.{% endcomment %}{% if href %}<a href="{{ href }}" class="chip{% if soft %} chip-soft{% endif %}"{% if active %} aria-current="page"{% endif %}{% if hx %} hx-get="{{ href }}" hx-target="{{ hx }}" hx-push-url="true"{% endif %}>{{ label }}</a>{% else %}<button type="button" class="chip" aria-pressed="{% if active %}true{% else %}false{% endif %}">{{ label }}</button>{% endif %}
