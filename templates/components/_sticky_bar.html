{% comment %}Sticky bottom bar with an optional caption/value on the left and one main action.{% endcomment %}{% load core_tags %}<div class="sticky-bar{% if lg_static %} lg-static{% endif %}">
  <div class="sticky-bar-inner">
    {% if caption or value %}<p class="flex min-w-0 flex-1 flex-col"><span class="text-caption muted">{{ caption }}</span><span class="price truncate">{{ value }}</span></p>{% endif %}
    <a href="{{ href }}" class="btn btn-primary btn-lg{% if not caption and not value %} btn-block{% endif %} min-h-[52px] px-6">{{ label }}{% icon "chevron-right" 18 stroke=2.5 %}</a>
  </div>
</div>
