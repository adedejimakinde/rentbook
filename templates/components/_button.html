{% comment %}Pill button. variant: primary | secondary | ghost | brand | white | whatsapp | dark. Pass href for a link, else a <button>.{% endcomment %}{% load core_tags %}{% if href %}<a href="{{ href }}" class="btn btn-{{ variant|default:'primary' }}{% if large %} btn-lg{% endif %}{% if block %} btn-block{% endif %}{% if css %} {{ css }}{% endif %}"{% if rel %} rel="{{ rel }}"{% endif %}>{% if leading %}{% icon leading 18 %}{% endif %}{{ label }}{% if variant == "ghost" %}{% icon "chevron-right" 16 stroke=2.5 %}{% endif %}</a>{% else %}<button type="{{ type|default:'submit' }}" class="btn btn-{{ variant|default:'primary' }}{% if large %} btn-lg{% endif %}{% if block %} btn-block{% endif %}{% if css %} {{ css }}{% endif %}"{% if name %} name="{{ name }}" value="{{ value }}"{% endif %}>{% if leading %}{% icon leading 18 %}{% endif %}{{ label }}</button>{% endif %}
