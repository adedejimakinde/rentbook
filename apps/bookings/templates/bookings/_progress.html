<div class="mb-4">
  <p class="eyebrow">Step {{ step_number }} of {{ step_count }}</p>
  <div class="mt-2 h-1 w-full overflow-hidden rounded-pill bg-border" role="progressbar" aria-label="Booking progress" aria-valuemin="0" aria-valuemax="{{ step_count }}" aria-valuenow="{{ step_number }}" aria-valuetext="Step {{ step_number }} of {{ step_count }}: {{ step_title }}">
    <div class="h-full rounded-pill bg-brand" style="width: {{ progress }}%"></div>
  </div>
</div>
