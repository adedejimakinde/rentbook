{% with id_text=id|stringformat:"s" %}<form method="post" action="{% url 'bookings:cart_add' %}" hx-post="{% url 'bookings:cart_add' %}" hx-target="#add-result-{{ kind }}-{{ id }}" class="{% if result_outside %}shrink-0{% else %}space-y-3{% endif %}">
  {% csrf_token %}
  <input type="hidden" name="kind" value="{{ kind }}"><input type="hidden" name="id" value="{{ id }}">
  {% if quantity %}<input type="hidden" name="quantity" value="{{ quantity }}">
  {% else %}{% with qty_id="add-qty-"|add:kind|add:"-"|add:id_text %}<div class="max-w-[180px]"><label for="{{ qty_id }}" class="label label-caps">Quantity</label>
  {% include "components/_stepper.html" with id=qty_id value=1 %}</div>{% endwith %}{% endif %}
  <button type="submit" class="btn btn-primary btn-lg {% if result_outside %}min-h-[52px] px-6{% else %}btn-block sm:w-auto{% endif %}">Add {% if quantity and quantity > 1 %}{{ quantity }} {% endif %}to booking</button>
  {% if not result_outside %}<div id="add-result-{{ kind }}-{{ id }}" aria-live="polite"></div>{% endif %}
</form>{% endwith %}
