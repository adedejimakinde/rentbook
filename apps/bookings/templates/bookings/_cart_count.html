<a id="cart-count" href="{% url 'bookings:cart' %}"{% if oob %} hx-swap-oob="true"{% endif %} class="relative inline-flex min-h-11 min-w-11 items-center justify-center rounded-lg border border-primary text-primary" aria-label="Booking cart, {{ cart_count }} item{{ cart_count|pluralize }}">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
  {% if cart_count %}<span class="absolute -right-2 -top-2 inline-flex h-6 min-w-6 items-center justify-center rounded-full bg-accent px-1 text-xs font-bold text-white" aria-hidden="true">{{ cart_count }}</span>{% endif %}
</a>
