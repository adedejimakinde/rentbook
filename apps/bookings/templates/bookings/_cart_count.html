{% load core_tags %}<a id="cart-count" href="{% url 'bookings:cart' %}"{% if oob %} hx-swap-oob="true"{% endif %} class="relative inline-flex h-11 w-11 items-center justify-center rounded-pill text-ink hover:text-brand" aria-label="Booking cart, {{ cart_count }} item{{ cart_count|pluralize }}">
  {% icon "cart" 22 %}
  {% if cart_count %}<span class="absolute right-0.5 top-1 inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-pill bg-accent px-1 text-[11px] font-bold text-white" aria-hidden="true">{{ cart_count }}</span>{% endif %}
</a>
