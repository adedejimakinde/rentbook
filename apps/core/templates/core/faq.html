{% extends "base.html" %}
{% load core_tags %}
{% block content %}
<div class="wrap page">
  <div class="max-w-[760px]">
    <p class="eyebrow">Help</p>
    <h1 class="t-h1 mt-1 text-balance [overflow-wrap:anywhere]">Frequently asked questions</h1>
    <div class="mt-5">
      {% for question, answer in faqs %}
      <details class="acc"{% if forloop.first %} open{% endif %}>
        <summary><h2 class="text-[16px] leading-snug font-bold">{{ question }}</h2><span class="acc-icon">{% icon "plus" 20 stroke=2.5 %}</span></summary>
        <p class="acc-body text-[15px]">{{ answer }}</p>
      </details>
      {% endfor %}
    </div>
    <div class="panel mt-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <p class="font-bold">Still have a question?</p>
      <a href="{% url 'core:contact' %}" class="btn btn-secondary">Contact us</a>
    </div>
  </div>
</div>
{% endblock %}
